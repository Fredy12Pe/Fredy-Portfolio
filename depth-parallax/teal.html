<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Parallax Teal</title>
<style>
  :root { color-scheme: dark; }
  :root {
    --panel-h: 150px;   /* room reserved under the image for the sliders */
    --text: #e6e6e6;
    --muted: rgba(255, 255, 255, 0.55);
    --track: rgba(255, 255, 255, 0.18);
    --accent: #7fc4cf;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    padding: 16px 0;
    box-sizing: border-box;
  }
  /* A 16:9 frame, as large as the viewport allows with the sliders below */
  .stage {
    position: relative;
    width: min(100vw, calc((100vh - var(--panel-h)) * 16 / 9));
    aspect-ratio: 16 / 9;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .hint {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    pointer-events: none;
    transition: opacity 0.6s;
    white-space: nowrap;
  }
  .hint.hidden { opacity: 0; }

  .controls {
    width: min(100vw - 32px, 880px);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px 24px;
    align-items: end;
  }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .control output {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .control input[type="range"] {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
  }
  .actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
  }
  .actions button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--track);
    border-radius: 6px;
    padding: 6px 14px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .actions button:hover { color: var(--text); border-color: var(--muted); }
  @media (max-width: 600px) {
    :root { --panel-h: 320px; }
  }
  .fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ccc;
    padding: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="view" aria-label="Photo with depth-based parallax"></canvas>
  <div class="hint" id="hint">Move your cursor over the image</div>
</div>

<div class="controls" id="controls">
  <div class="control">
    <label for="strength">Strength <output id="strength-out"></output></label>
    <input type="range" id="strength" min="0" max="0.15" step="0.005">
  </div>
  <div class="control">
    <label for="focus">Focus depth <output id="focus-out"></output></label>
    <input type="range" id="focus" min="0" max="1" step="0.01">
  </div>
  <div class="control">
    <label for="ease">Smoothing <output id="ease-out"></output></label>
    <input type="range" id="ease" min="0" max="1" step="0.01">
  </div>
  <div class="control">
    <label for="vertical">Vertical motion <output id="vertical-out"></output></label>
    <input type="range" id="vertical" min="0" max="1" step="0.01">
  </div>
  <div class="actions"><button type="button" id="reset">Reset</button></div>
</div>
<div class="fallback" id="fallback">WebGL is not available in this browser.</div>

<script>

  const canvas = document.getElementById('view');
  const hint = document.getElementById('hint');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });

  if (!gl) {
    document.getElementById('fallback').style.display = 'flex';
    canvas.style.display = 'none';
    hint.style.display = 'none';
    return;
  }

  // Tuning knobs, driven by the sliders under the image
  const DEFAULTS = {
    strength: 0.05,   // max shift as a fraction of the image size
    focus: 0.5,       // depth value that stays put (0 = far, 1 = near)
    ease: 0.5,        // smoothing, 0 = snappy, 1 = very slow follow
    vertical: 1,      // how much vertical cursor movement counts (0 = horizontal only)
  };
  const settings = { ...DEFAULTS };
  // Map the 0..1 smoothing slider to a per-frame follow factor (0.5 down to ~0.008)
  const easeFactor = () => Math.pow(0.5, 1 + settings.ease * 6);

  const vertSrc = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      vUv.y = 1.0 - vUv.y;           // image row 0 is at the top
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  const fragSrc = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPhoto;
    uniform sampler2D uDepth;
    uniform vec2 uOffset;      // cursor offset, -1..1 per axis
    uniform float uStrength;
    uniform float uFocus;
    uniform vec2 uScale;       // cover-fit scale for the image
    uniform vec2 uMaxShift;    // largest shift in uv units (keeps edges covered)

    void main() {
      // Map screen uv to image uv, cropping to keep the aspect ratio ("cover")

      vec2 uv = (vUv - 0.5) * uScale + 0.5;

      float depth = texture2D(uDepth, uv).r;
      // Nearer pixels (brighter in the depth map) move more than far ones
      float k = (depth - uFocus) * uStrength;
      vec2 shift = clamp(-uOffset * k, -uMaxShift, uMaxShift);

      vec2 srcUv = clamp(uv + shift, 0.0, 1.0);
      vec3 col = texture2D(uPhoto, srcUv).rgb;
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  // Full-screen quad
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const u = {
    photo: gl.getUniformLocation(program, 'uPhoto'),
    depth: gl.getUniformLocation(program, 'uDepth'),
    offset: gl.getUniformLocation(program, 'uOffset'),
    strength: gl.getUniformLocation(program, 'uStrength'),
    focus: gl.getUniformLocation(program, 'uFocus'),
    scale: gl.getUniformLocation(program, 'uScale'),
    maxShift: gl.getUniformLocation(program, 'uMaxShift'),
  };

  gl.uniform1f(u.strength, settings.strength);
  gl.uniform1f(u.focus, settings.focus);

  function loadTexture(unit, url, onLoad) {
    const tex = gl.createTexture();
    const img = new Image();
    img.onload = () => {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      onLoad(img);
    };
    img.onerror = () => {
      const fb = document.getElementById('fallback');
      fb.textContent = 'Could not load an image. Serve this folder over http (for example: python3 -m http.server).';
      fb.style.display = 'flex';
    };
    img.src = url;
    return tex;
  }

  let imgAspect = 1.5;
  let loaded = 0;
  const onLoaded = (img) => {
    if (img.width) imgAspect = img.width / img.height;
    if (++loaded === 2) { resize(); requestAnimationFrame(frame); }
  };
  loadTexture(0, PHOTO_SRC, onLoaded);
  loadTexture(1, DEPTH_SRC, onLoaded);
  gl.uniform1i(u.photo, 0);
  gl.uniform1i(u.depth, 1);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);

    // Cover-fit: scale the image so it fills the screen, cropping the overflow
    const screenAspect = w / h;
    let sx = 1, sy = 1;
    if (screenAspect > imgAspect) {
      sy = imgAspect / screenAspect;   // crop top and bottom
    } else {
      sx = screenAspect / imgAspect;   // crop left and right
    }
    // Scale the image up slightly and clamp the shift to stay inside the frame
    // Just enough extra zoom to hide the edges at the largest shift
    const zoom = 1 - settings.strength;
    sx *= zoom;
    sy *= zoom;
    gl.uniform2f(u.scale, sx, sy);
    // Free margin between the visible region and the image edge, per axis
    gl.uniform2f(u.maxShift, (1 - sx) / 2 * 0.98, (1 - sy) / 2 * 0.98);
  }
  window.addEventListener('resize', () => { if (loaded === 2) resize(); });

  // Cursor tracking, smoothed each frame
  const target = { x: 0, y: 0 };
  const current = { x: 0, y: 0 };
  let hintHidden = false;

  function setTarget(clientX, clientY) {
    // Cursor position relative to the frame, from -1 to 1
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top) / rect.height;
    target.x = Math.max(-1, Math.min(1, x * 2 - 1));
    target.y = Math.max(-1, Math.min(1, y * 2 - 1));
    if (!hintHidden) { hint.classList.add('hidden'); hintHidden = true; }
  }
  // Only the image reacts to the cursor, so using the sliders doesn't move it
  canvas.addEventListener('pointermove', (e) => setTarget(e.clientX, e.clientY));
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) setTarget(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('pointerleave', () => { target.x = 0; target.y = 0; });

  // Sliders
  const formats = {
    strength: (v) => v.toFixed(3),
    focus: (v) => v.toFixed(2),
    ease: (v) => Math.round(v * 100) + '%',
    vertical: (v) => Math.round(v * 100) + '%',
  };
  const inputs = {};
  for (const key of Object.keys(DEFAULTS)) {
    const input = document.getElementById(key);
    const out = document.getElementById(key + '-out');
    inputs[key] = input;
    input.value = settings[key];
    out.textContent = formats[key](settings[key]);
    input.addEventListener('input', () => {
      settings[key] = parseFloat(input.value);
      out.textContent = formats[key](settings[key]);
      applySettings();
    });
  }
  function applySettings() {
    gl.uniform1f(u.strength, settings.strength);
    gl.uniform1f(u.focus, settings.focus);
    if (loaded === 2) resize();   // edge zoom depends on strength
  }
  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(settings, DEFAULTS);
    for (const key of Object.keys(DEFAULTS)) {
      inputs[key].value = settings[key];
      document.getElementById(key + '-out').textContent = formats[key](settings[key]);
    }
    applySettings();
  });

  function frame() {
    const ease = easeFactor();
    current.x += (target.x - current.x) * ease;
    current.y += (target.y * settings.vertical - current.y) * ease;
    gl.uniform2f(u.offset, current.x, current.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
